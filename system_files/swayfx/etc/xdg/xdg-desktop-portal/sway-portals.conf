# Overrides Fedora's /usr/share/xdg-desktop-portal/sway-portals.conf for this image.
# The only change is the Secret portal. Fedora points it at gnome-keyring, which isn't
# installed here. On this KDE base, Plasma Login Manager's PAM stack unlocks KWallet in
# every session, sway included, so Flatpak apps keep their secrets there too.

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=kwallet
# https://github.com/flatpak/xdg-desktop-portal-gtk/issues/465
org.freedesktop.impl.portal.Inhibit=none
