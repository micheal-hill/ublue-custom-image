# Borders, gaps and SwayFX effects (syntax: https://github.com/wlrfx/swayfx, 0.6.x).
# Vendor default: to change it, put a file with the same name in
# ~/.config/sway/config.d/ (an empty file turns all of this off).

default_border pixel 2
hide_edge_borders --i3 none
gaps inner 4

corner_radius 4
smart_corner_radius enable
shadows enable
default_dim_inactive 0.2
animation_duration_ms 150
