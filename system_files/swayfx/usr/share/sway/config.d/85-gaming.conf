# Gaming defaults. Override with a same-named file in ~/.config/sway/config.d/.

# Never idle/lock while a Steam game is fullscreen
for_window [class="^steam_app_"] inhibit_idle fullscreen

# Let fullscreen games that request it present with tearing (lower latency).
# Apps decide through the tearing-control hint; no window is forced to tear.
output * allow_tearing yes

# adaptive_sync is left off: it flickers on some panels. Enable per output:
#   output eDP-1 adaptive_sync on
