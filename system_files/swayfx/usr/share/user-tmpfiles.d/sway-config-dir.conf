# Displays Settings (nwg-displays) won't start unless ~/.config/sway exists, and it saves
# the screen layout there. Create that folder for every user at login, and leave an
# existing one as it is. sway keeps reading /etc/sway/config until you add your own config.
# (tmpfiles has no specifier for $XDG_CONFIG_HOME, hence the fixed ~/.config.)
d %h/.config/sway - - - -
