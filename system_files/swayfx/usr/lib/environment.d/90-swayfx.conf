# Read by systemd --user, so these also reach D-Bus-activated apps, and by Fedora's
# start-sway. Both are no-ops in the KDE Plasma session.

# sway/SwayFX shows an "unsupported GPU" warning bar whenever the proprietary NVIDIA
# module is loaded, even when (as on Optimus laptops) the Intel iGPU drives every
# display. This silences it; harmless on machines without NVIDIA.
SWAY_UNSUPPORTED_GPU=true

# KDE apps (Dolphin, Konsole, Kate, ...) use KDE's Qt platform theme outside Plasma too:
# the same colours, icons, fonts and file dialogs as in Plasma (Plasma picks it anyway).
QT_QPA_PLATFORMTHEME=kde
