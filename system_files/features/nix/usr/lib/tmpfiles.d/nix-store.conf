# Skeleton of the Nix store on the /var/nix bind mount, with the same ownership and
# modes as Fedora's nix-system package. nix-daemon creates the rest (db, gcroots,
# profiles, temproots) on its first start, and nix-daemon.conf creates the daemon socket directory.
# On every boot, tmpfiles also resets these directories' SELinux labels to the
# policy's (set up in build_files/features/nix.sh), which repairs earlier installs.
d /nix                  0755 root root   - -
d /nix/store            1775 root nixbld - -
d /nix/var              0755 root root   - -
d /nix/var/nix          0775 root nixbld - -
d /nix/var/log/nix/drvs 0775 root nixbld - -
