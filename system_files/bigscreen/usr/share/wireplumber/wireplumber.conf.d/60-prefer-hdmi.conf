# HTPC: prefer HDMI/DisplayPort audio (the TV or AV receiver) over analog or
# headphone outputs when picking the default sink. A sink chosen by hand in
# the audio settings still wins, because WirePlumber remembers it.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi.*" }
      { node.name = "~alsa_output.*displayport.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
]
